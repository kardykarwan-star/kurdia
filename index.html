
<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KURDIA — Made in Kurdistan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fffdf5;
      color: #171717;
    }

    header {
      background: #111;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: #ffd21c;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 15px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #fffdf5, #fff1a8);
    }

    .hero h1 {
      font-size: 55px;
      font-weight: 900;
      color: #111;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #e5b800;
    }

    .hero p {
      font-size: 20px;
      color: #555;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #111;
      color: #ffd21c;
      padding: 15px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      border: 2px solid #ffd21c;
    }

    .section {
      padding: 55px 20px;
      text-align: center;
    }

    .section h2 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .category {
      background: white;
      padding: 25px 15px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      font-weight: bold;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    footer strong {
      color: #ffd21c;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 42px;
      }

      nav a {
        font-size: 12px;
        margin-left: 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">KURDIA</div>

    <nav>
      <a href="#">Home</a>
      <a href="#categories">Categories</a>
      <a href="#">Brands</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <h1>Discover <span>KURDIA</span></h1>
      <p>Made in Kurdistan — Kurdish Brands & Local Products</p>

      <a href="#categories" class="btn">Explore Products</a>
    </div>
  </section>

  <section class="section" id="categories">
    <h2>Shop by Category</h2>

    <div class="categories">
      <div class="category">👕 Fashion</div>
      <div class="category">👜 Bags & Shoes</div>
      <div class="category">💄 Beauty</div>
      <div class="category">🍯 Food</div>
      <div class="category">🏠 Home</div>
      <div class="category">🎁 Gifts</div>
    </div>
  </section>

  <footer>
    <p><strong>KURDIA</strong></p>
    <p>Made in Kurdistan 🇹🇯</p>
    <br>
    <p>All Kurdish brands in one place.</p>
  </footer>

</body>
</html>
